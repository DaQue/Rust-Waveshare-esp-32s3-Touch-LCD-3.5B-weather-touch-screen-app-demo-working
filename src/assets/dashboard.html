<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;padding:12px;max-width:900px;margin:0 auto}
h1{font-size:1.1rem;color:#7d8590;font-weight:400;margin-bottom:12px}
h1 span{color:#58a6ff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
.card .label{font-size:.7rem;color:#7d8590;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.card .value{font-size:1.6rem;font-weight:600;color:#e6edf3}
.card .value.big{font-size:2rem}
.card .unit{font-size:.8rem;color:#7d8590;margin-left:2px}
.card .sub{font-size:.75rem;color:#7d8590;margin-top:2px}
.card.accent{border-color:#1f6feb}
.section-title{font-size:.75rem;color:#7d8590;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px}
.chart-wrap{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
svg text{font-family:system-ui,sans-serif}
.legend{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:#7d8590}
.legend-dot{width:10px;height:3px;border-radius:2px}
.legend-box{width:10px;height:10px;border-radius:2px;opacity:.6}
.status{font-size:.7rem;color:#7d8590;margin-top:12px;text-align:right}
.stale{color:#f85149}
</style>
</head>
<body>
<h1>ESP32 Weather &nbsp;<span id="city">—</span></h1>

<div class="section-title">Outdoor</div>
<div class="grid" id="outdoor-grid">
  <div class="card accent">
    <div class="label">Temperature</div>
    <div class="value big" id="temp">—<span class="unit">°F</span></div>
    <div class="sub" id="feels">Feels like —</div>
  </div>
  <div class="card">
    <div class="label">Condition</div>
    <div class="value" style="font-size:1rem;padding-top:6px" id="condition">—</div>
  </div>
  <div class="card">
    <div class="label">Humidity</div>
    <div class="value" id="hum-out">—<span class="unit">%</span></div>
  </div>
  <div class="card">
    <div class="label">Wind</div>
    <div class="value" id="wind">—<span class="unit">mph</span></div>
  </div>
</div>

<div class="section-title">Indoor</div>
<div class="grid">
  <div class="card accent">
    <div class="label">Temperature</div>
    <div class="value big" id="in-temp">—<span class="unit">°F</span></div>
  </div>
  <div class="card">
    <div class="label">Humidity</div>
    <div class="value" id="in-hum">—<span class="unit">%</span></div>
  </div>
  <div class="card">
    <div class="label">Pressure</div>
    <div class="value" style="font-size:1.2rem" id="in-press">—<span class="unit">hPa</span></div>
  </div>
  <div class="card">
    <div class="label">HVAC</div>
    <div class="value" style="font-size:1rem;padding-top:6px" id="hvac-state">—</div>
  </div>
</div>

<div class="section-title">2h Indoor History</div>
<div class="chart-wrap">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Temp °F</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Humidity %</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Outdoor °F</div>
  </div>
  <svg id="chart2h" width="100%" height="160" viewBox="0 0 860 160" preserveAspectRatio="none"></svg>
</div>

<div class="section-title">24h Indoor History</div>
<div class="chart-wrap">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Temp °F</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Humidity %</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Outdoor °F</div>
    <div class="legend-item"><div class="legend-box" style="background:#f85149"></div>Heat</div>
    <div class="legend-item"><div class="legend-box" style="background:#388bfd"></div>Cool</div>
  </div>
  <svg id="chart24h" width="100%" height="200" viewBox="0 0 860 200" preserveAspectRatio="none"></svg>
</div>

<div class="section-title">HVAC 24h Summary</div>
<div class="chart-wrap" style="padding:10px 12px">
  <div id="hvac-summary" style="font-size:.85rem;color:#e6edf3;line-height:1.8">—</div>
</div>

<div class="status" id="status">Loading…</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (v, d) => v == null ? '—' : v.toFixed(d);

function setVal(id, v, d=1) {
  const el = $(id);
  const unit = el.querySelector('.unit');
  if (v == null) { el.childNodes[0].textContent = '—'; return; }
  el.childNodes[0].textContent = v.toFixed(d);
  if (unit) unit.textContent = unit.textContent;
}

function fmtUptime(s) {
  if (!s) return '—';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h + 'h ' + m + 'm';
}

function fmtMins(m) {
  const h = Math.floor(m/60), min = m%60;
  return h > 0 ? h + 'h ' + min + 'm' : min + 'm';
}

const HVAC_LABELS = ['Idle', 'Heat', 'Cool'];
const HVAC_COLORS = ['#7d8590', '#f85149', '#388bfd'];

async function fetchCurrent() {
  try {
    const r = await fetch('/api/current');
    const d = await r.json();
    $('city').textContent = d.city || '—';
    setVal('temp', d.temp_f, 1);
    $('feels').textContent = d.feels_f != null ? 'Feels like ' + d.feels_f.toFixed(1) + '°F' : '';
    $('condition').textContent = d.condition || '—';
    setVal('hum-out', d.humidity, 0);
    setVal('wind', d.wind_mph, 1);
    setVal('in-temp', d.indoor_temp_f, 1);
    setVal('in-hum', d.indoor_humidity_pct, 1);
    setVal('in-press', d.indoor_pressure_hpa, 1);
    const hv = d.hvac_state || 0;
    $('hvac-state').textContent = HVAC_LABELS[hv] || 'Idle';
    $('hvac-state').style.color = HVAC_COLORS[hv] || '#7d8590';
    $('status').className = 'status';
    $('status').textContent = 'Updated ' + new Date().toLocaleTimeString() +
      ' · ' + d.firmware + ' · ' + d.ip_address +
      ' · uptime ' + fmtUptime(d.uptime_s);
  } catch(e) {
    $('status').className = 'status stale';
    $('status').textContent = 'Fetch failed: ' + e;
  }
}

// Draw temp+humidity+outdoor line chart with optional HVAC background bands
function drawLineChart(svgId, samples, W, H, showHvac) {
  const svg = $(svgId);
  const PL=38, PR=8, PT=8, PB=20;
  const cw=W-PL-PR, ch=H-PT-PB;
  if (!samples.length) {
    svg.innerHTML = '<text x="430" y="'+(H/2)+'" fill="#7d8590" text-anchor="middle" font-size="12">No data yet</text>';
    return;
  }

  const tf = samples.map(s=>s.tf);
  const hf = samples.map(s=>s.h);
  const ot = samples.map(s=>s.otu > 0 ? s.otu - 41 : null);
  const otVals = ot.filter(v=>v!==null);
  const hasOt = otVals.length > 1;

  function range(arr) {
    let mn=arr[0], mx=arr[0];
    for(const v of arr){if(v<mn)mn=v;if(v>mx)mx=v;}
    const pad=(mx-mn)*0.1||1;
    return [mn-pad, mx+pad];
  }

  // Expand temp range to include outdoor temps so both fit on same axis
  const allTemps = hasOt ? [...tf, ...otVals] : tf;
  const [tmin,tmax] = range(allTemps);
  const [hmin,hmax] = range(hf);

  const xOf = i => PL + (i/(samples.length-1||1))*cw;
  const yOf = (v,mn,mx) => PT + ch - ((v-mn)/(mx-mn||1))*ch;

  function poly(arr, mn, mx, color) {
    const pts = arr.map((v,i) => xOf(i).toFixed(1)+','+yOf(v,mn,mx).toFixed(1));
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>`;
  }

  // Outdoor line — split into segments across null gaps
  function otPoly() {
    let svg = '', cur = [];
    const flush = () => {
      if(cur.length > 1) svg += `<polyline points="${cur.join(' ')}" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-linejoin="round"/>`;
      cur = [];
    };
    for(let i=0; i<samples.length; i++) {
      if(ot[i] !== null) cur.push(xOf(i).toFixed(1)+','+yOf(ot[i],tmin,tmax).toFixed(1));
      else flush();
    }
    flush();
    return svg;
  }

  // Y-axis labels (temp scale on left)
  let yLabels = '';
  for(let i=0; i<=4; i++){
    const v = tmin+(tmax-tmin)*(i/4);
    const y = PT+ch-(i/4)*ch;
    yLabels += `<text x="${PL-4}" y="${y+4}" fill="#7d8590" font-size="9" text-anchor="end">${v.toFixed(0)}</text>`;
    yLabels += `<line x1="${PL}" y1="${y}" x2="${PL+cw}" y2="${y}" stroke="#21262d" stroke-width="0.5"/>`;
  }

  // X-axis time labels at 0%, 25%, 50%, 75%, 100%
  let xLabels = '';
  if(samples.length > 1) {
    const fmtT = ts => { const d=new Date(ts*1000); return d.getHours()+':'+(d.getMinutes()+'').padStart(2,'0'); };
    [0, 0.25, 0.5, 0.75, 1].forEach(p => {
      const idx = Math.round(p*(samples.length-1));
      const x = PL + p*cw;
      const anchor = p===0 ? 'start' : p===1 ? 'end' : 'middle';
      xLabels += `<text x="${x.toFixed(1)}" y="${H-4}" fill="#7d8590" font-size="9" text-anchor="${anchor}">${fmtT(samples[idx].ts)}</text>`;
    });
  }

  // HVAC background bands
  let bands = '';
  if(showHvac && samples.length > 1) {
    let bandStart = 0, bandState = samples[0].hv||0;
    for(let i=1; i<=samples.length; i++){
      const hv = i < samples.length ? (samples[i].hv||0) : -1;
      if(hv !== bandState) {
        if(bandState !== 0) {
          const color = bandState===1 ? '#f85149' : '#388bfd';
          const x0 = xOf(bandStart), x1 = xOf(i < samples.length ? i : samples.length-1);
          bands += `<rect x="${x0.toFixed(1)}" y="${PT}" width="${(x1-x0).toFixed(1)}" height="${ch}" fill="${color}" opacity="0.15"/>`;
        }
        bandStart = i; bandState = hv;
      }
    }
  }

  svg.innerHTML = bands + yLabels + xLabels +
    poly(tf, tmin, tmax, '#58a6ff') +
    poly(hf, hmin, hmax, '#3fb950') +
    (hasOt ? otPoly() : '');
}

function renderHvacSummary(samples) {
  let heatMins=0, coolMins=0, heatCycles=0, coolCycles=0;
  let prevHv = 0;
  for(const s of samples){
    const hv = s.hv||0;
    if(hv===1) heatMins++;
    if(hv===2) coolMins++;
    if(hv !== prevHv){
      if(hv===1) heatCycles++;
      if(hv===2) coolCycles++;
    }
    prevHv = hv;
  }
  const el = $('hvac-summary');
  if(!heatMins && !coolMins){
    el.textContent = 'No HVAC activity recorded yet';
    return;
  }
  el.innerHTML =
    `<span style="color:#f85149">▲ Heat</span> ${fmtMins(heatMins)} &nbsp;·&nbsp; ${heatCycles} cycle${heatCycles!==1?'s':''}` +
    `&emsp;<span style="color:#388bfd">▼ Cool</span> ${fmtMins(coolMins)} &nbsp;·&nbsp; ${coolCycles} cycle${coolCycles!==1?'s':''}`;
}

async function fetchHistory() {
  try {
    const r = await fetch('/api/history?hours=24');
    const data = await r.json();
    const last2h = data.slice(-120);
    drawLineChart('chart2h',  last2h, 860, 160, true);
    drawLineChart('chart24h', data,   860, 200, true);
    renderHvacSummary(data);
  } catch(e) {
    ['chart2h','chart24h'].forEach(id => {
      $(id).innerHTML = '<text x="430" y="80" fill="#f85149" text-anchor="middle" font-size="12">History fetch failed</text>';
    });
  }
}

fetchCurrent();
fetchHistory();
setInterval(fetchCurrent, 30000);
setInterval(fetchHistory, 300000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { fetchCurrent(); fetchHistory(); }
});
</script>
</body>
</html>
