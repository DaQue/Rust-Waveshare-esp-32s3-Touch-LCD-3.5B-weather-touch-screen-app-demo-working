<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;padding:8px;max-width:1200px;margin:0 auto}
h1{font-size:1rem;color:#7d8590;font-weight:400;margin-bottom:8px}
h1 span{color:#58a6ff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:8px}
.card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 10px}
.card .label{font-size:.65rem;color:#7d8590;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.card .value{font-size:1.4rem;font-weight:600;color:#e6edf3}
.card .value.big{font-size:1.7rem}
.card .unit{font-size:.75rem;color:#7d8590;margin-left:2px}
.card .sub{font-size:.7rem;color:#7d8590;margin-top:1px}
.card.accent{border-color:#1f6feb}
.section-title{font-size:.7rem;color:#7d8590;text-transform:uppercase;letter-spacing:.08em;margin:8px 0 4px}
.chart-wrap{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 10px}
svg text{font-family:system-ui,sans-serif}
.legend{display:flex;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:.68rem;color:#7d8590}
.legend-dot{width:10px;height:3px;border-radius:2px}
.legend-box{width:9px;height:9px;border-radius:2px;opacity:.6}
.status{font-size:.65rem;color:#7d8590;margin-top:8px;text-align:right}
.stale{color:#f85149}
.row-title{display:flex;align-items:center;gap:8px;margin:8px 0 4px}
.row-title .section-title{margin:0}
.t-btn{background:#21262d;border:1px solid #30363d;border-radius:4px;color:#7d8590;font-size:.65rem;padding:2px 8px;cursor:pointer;line-height:1.4}
.t-btn.active{background:#1f6feb;border-color:#1f6feb;color:#e6edf3}
</style>
</head>
<body>
<h1>ESP32 Weather &nbsp;<span id="city">—</span></h1>

<div class="section-title">Outdoor</div>
<div class="grid" id="outdoor-grid">
  <div class="card accent">
    <div class="label">Temperature</div>
    <div class="value big" id="temp">—<span class="unit">°F</span></div>
    <div class="sub" id="feels">Feels like —</div>
  </div>
  <div class="card">
    <div class="label">Condition</div>
    <div class="value" style="font-size:1rem;padding-top:6px" id="condition">—</div>
  </div>
  <div class="card">
    <div class="label">Humidity</div>
    <div class="value" id="hum-out">—<span class="unit">%</span></div>
  </div>
  <div class="card">
    <div class="label">Wind</div>
    <div class="value" id="wind">—<span class="unit">mph</span></div>
  </div>
</div>

<div class="section-title">Indoor</div>
<div class="grid">
  <div class="card accent">
    <div class="label">Temperature</div>
    <div class="value big" id="in-temp">—<span class="unit">°F</span></div>
  </div>
  <div class="card">
    <div class="label">Humidity</div>
    <div class="value" id="in-hum">—<span class="unit">%</span></div>
  </div>
  <div class="card">
    <div class="label">Pressure</div>
    <div class="value" style="font-size:1.2rem" id="in-press">—<span class="unit">hPa</span></div>
  </div>
  <div class="card">
    <div class="label">HVAC</div>
    <div class="value" style="font-size:1rem;padding-top:6px" id="hvac-state">—</div>
  </div>
</div>

<div class="row-title">
  <span class="section-title">Indoor History</span>
  <button id="btn2h"  class="t-btn"        onclick="setView('2h')">2H</button>
  <button id="btn24h" class="t-btn active" onclick="setView('24h')">24H</button>
</div>
<div class="chart-wrap">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Temp °F</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Humidity %</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Outdoor °F</div>
    <div class="legend-item"><div class="legend-box" style="background:#f85149"></div>Heat</div>
    <div class="legend-item"><div class="legend-box" style="background:#388bfd"></div>Cool</div>
  </div>
  <svg id="chartIndoor" width="100%" height="150" viewBox="0 0 860 150" preserveAspectRatio="none"></svg>
</div>

<div class="section-title" id="hvac-title">HVAC 24h Summary</div>
<div class="chart-wrap" style="padding:10px 12px">
  <div id="hvac-summary" style="font-size:.85rem;color:#e6edf3;line-height:1.8">—</div>
</div>

<div class="section-title" id="press-title">24h Pressure</div>
<div class="chart-wrap">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Indoor hPa</div>
    <div class="legend-item"><div class="legend-dot" style="background:#bc8cff"></div>Outdoor hPa</div>
  </div>
  <svg id="chartPress" width="100%" height="110" viewBox="0 0 860 110" preserveAspectRatio="none"></svg>
</div>

<div class="status" id="status">Loading…</div>

<script>
const $ = id => document.getElementById(id);

function setVal(id, v, d=1) {
  const el = $(id);
  const unit = el.querySelector('.unit');
  if (v == null) { el.childNodes[0].textContent = '—'; return; }
  el.childNodes[0].textContent = v.toFixed(d);
  if (unit) unit.textContent = unit.textContent;
}

function fmtUptime(s) {
  if (!s) return '—';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h + 'h ' + m + 'm';
}

function fmtMins(m) {
  const h = Math.floor(m/60), min = m%60;
  return h > 0 ? h + 'h ' + min + 'm' : min + 'm';
}

const HVAC_LABELS = ['Idle', 'Heat', 'Cool'];
const HVAC_COLORS = ['#7d8590', '#f85149', '#388bfd'];

let allData = [];
let currentView = '24h';

function setView(v) {
  currentView = v;
  $('btn2h').className  = 't-btn' + (v === '2h'  ? ' active' : '');
  $('btn24h').className = 't-btn' + (v === '24h' ? ' active' : '');
  renderAll();
}

function renderAll() {
  if (!allData.length) return;
  const label = currentView === '2h' ? '2h' : '24h';
  const samples = currentView === '2h' ? allData.slice(-120) : allData;
  $('hvac-title').textContent  = 'HVAC ' + label + ' Summary';
  $('press-title').textContent = label + ' Pressure';
  drawLineChart('chartIndoor', samples, 860, 150, true, allData);
  drawPressureChart('chartPress', samples, 860, 110, allData);
  renderHvacSummary(samples);
}

async function fetchCurrent() {
  try {
    const r = await fetch('/api/current');
    const d = await r.json();
    $('city').textContent = d.city || '—';
    setVal('temp', d.temp_f, 1);
    $('feels').textContent = d.feels_f != null ? 'Feels like ' + d.feels_f.toFixed(1) + '°F' : '';
    $('condition').textContent = d.condition || '—';
    setVal('hum-out', d.humidity, 0);
    setVal('wind', d.wind_mph, 1);
    setVal('in-temp', d.indoor_temp_f, 1);
    setVal('in-hum', d.indoor_humidity_pct, 1);
    setVal('in-press', d.indoor_pressure_hpa, 1);
    const hv = d.hvac_state || 0;
    $('hvac-state').textContent = HVAC_LABELS[hv] || 'Idle';
    $('hvac-state').style.color = HVAC_COLORS[hv] || '#7d8590';
    $('status').className = 'status';
    $('status').textContent = 'Updated ' + new Date().toLocaleTimeString() +
      ' · ' + d.firmware + ' · ' + d.ip_address +
      ' · uptime ' + fmtUptime(d.uptime_s);
  } catch(e) {
    $('status').className = 'status stale';
    $('status').textContent = 'Fetch failed: ' + e;
  }
}

// Draw temp+humidity+outdoor line chart with optional HVAC background bands.
// rangeData: dataset used to compute Y axis range (default: samples).
// Pass the full 24h dataset so scale stays consistent when switching views.
function drawLineChart(svgId, samples, W, H, showHvac, rangeData) {
  rangeData = rangeData || samples;
  const svg = $(svgId);
  const PL=38, PR=8, PT=8, PB=20;
  const cw=W-PL-PR, ch=H-PT-PB;
  if (!samples.length) {
    svg.innerHTML = '<text x="430" y="'+(H/2)+'" fill="#7d8590" text-anchor="middle" font-size="12">No data yet</text>';
    return;
  }

  const tf = samples.map(s=>s.tf);
  const hf = samples.map(s=>s.h);
  const ot = samples.map(s=>s.otu > 0 ? s.otu - 41 : null);
  const hasOt = ot.filter(v=>v!==null).length > 1;

  // Compute Y range from rangeData for consistency across view switches
  function rangeOf(arr) {
    let mn=arr[0], mx=arr[0];
    for(const v of arr){if(v<mn)mn=v;if(v>mx)mx=v;}
    const pad=(mx-mn)*0.1||1;
    return [mn-pad, mx+pad];
  }
  const rdTf = rangeData.map(s=>s.tf);
  const rdOt = rangeData.map(s=>s.otu>0?s.otu-41:null).filter(v=>v!==null);
  const rdHf = rangeData.map(s=>s.h);
  const allTemps = rdOt.length > 1 ? [...rdTf, ...rdOt] : rdTf;
  const [tmin,tmax] = rangeOf(allTemps);
  const [hmin,hmax] = rangeOf(rdHf);

  const xOf = i => PL + (i/(samples.length-1||1))*cw;
  const yOf = (v,mn,mx) => PT + ch - ((v-mn)/(mx-mn||1))*ch;

  function poly(arr, mn, mx, color) {
    const pts = arr.map((v,i) => xOf(i).toFixed(1)+','+yOf(v,mn,mx).toFixed(1));
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>`;
  }

  function otPoly() {
    let out = '', cur = [];
    const flush = () => {
      if(cur.length > 1) out += `<polyline points="${cur.join(' ')}" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-linejoin="round"/>`;
      cur = [];
    };
    for(let i=0; i<samples.length; i++) {
      if(ot[i] !== null) cur.push(xOf(i).toFixed(1)+','+yOf(ot[i],tmin,tmax).toFixed(1));
      else flush();
    }
    flush();
    return out;
  }

  let yLabels = '';
  for(let i=0; i<=4; i++){
    const v = tmin+(tmax-tmin)*(i/4);
    const y = PT+ch-(i/4)*ch;
    yLabels += `<text x="${PL-4}" y="${y+4}" fill="#7d8590" font-size="9" text-anchor="end">${v.toFixed(0)}</text>`;
    yLabels += `<line x1="${PL}" y1="${y}" x2="${PL+cw}" y2="${y}" stroke="#21262d" stroke-width="0.5"/>`;
  }

  let xLabels = '';
  if(samples.length > 1) {
    const fmtT = ts => { const d=new Date(ts*1000); return d.getHours()+':'+(d.getMinutes()+'').padStart(2,'0'); };
    [0, 0.25, 0.5, 0.75, 1].forEach(p => {
      const idx = Math.round(p*(samples.length-1));
      const x = PL + p*cw;
      const anchor = p===0 ? 'start' : p===1 ? 'end' : 'middle';
      xLabels += `<text x="${x.toFixed(1)}" y="${H-4}" fill="#7d8590" font-size="9" text-anchor="${anchor}">${fmtT(samples[idx].ts)}</text>`;
    });
  }

  let bands = '';
  if(showHvac && samples.length > 1) {
    let bandStart = 0, bandState = samples[0].hv||0;
    for(let i=1; i<=samples.length; i++){
      const hv = i < samples.length ? (samples[i].hv||0) : -1;
      if(hv !== bandState) {
        if(bandState !== 0) {
          const color = bandState===1 ? '#f85149' : '#388bfd';
          const x0 = xOf(bandStart), x1 = xOf(i < samples.length ? i : samples.length-1);
          bands += `<rect x="${x0.toFixed(1)}" y="${PT}" width="${(x1-x0).toFixed(1)}" height="${ch}" fill="${color}" opacity="0.15"/>`;
        }
        bandStart = i; bandState = hv;
      }
    }
  }

  svg.innerHTML = bands + yLabels + xLabels +
    poly(tf, tmin, tmax, '#58a6ff') +
    poly(hf, hmin, hmax, '#3fb950') +
    (hasOt ? otPoly() : '');
}

function renderHvacSummary(samples) {
  let heatMins=0, coolMins=0, heatCycles=0, coolCycles=0;
  let prevHv = 0;
  for(const s of samples){
    const hv = s.hv||0;
    if(hv===1) heatMins++;
    if(hv===2) coolMins++;
    if(hv !== prevHv){
      if(hv===1) heatCycles++;
      if(hv===2) coolCycles++;
    }
    prevHv = hv;
  }
  const el = $('hvac-summary');
  if(!heatMins && !coolMins){
    el.textContent = 'No HVAC activity recorded yet';
    return;
  }
  el.innerHTML =
    `<span style="color:#f85149">▲ Heat</span> ${fmtMins(heatMins)} &nbsp;·&nbsp; ${heatCycles} cycle${heatCycles!==1?'s':''}` +
    `&emsp;<span style="color:#388bfd">▼ Cool</span> ${fmtMins(coolMins)} &nbsp;·&nbsp; ${coolCycles} cycle${coolCycles!==1?'s':''}`;
}

// rangeData: full dataset for Y scale consistency across view switches
function drawPressureChart(svgId, samples, W, H, rangeData) {
  rangeData = rangeData || samples;
  const svg = $(svgId);
  const PL=48, PR=8, PT=8, PB=20;
  const cw=W-PL-PR, ch=H-PT-PB;
  if (!samples.length) {
    svg.innerHTML = '<text x="430" y="'+(H/2)+'" fill="#7d8590" text-anchor="middle" font-size="12">No data yet</text>';
    return;
  }

  const indoor  = samples.map(s=>s.p);
  const outdoor = samples.map(s=>s.op > 0 ? s.op / 10 : null);

  // Range from full rangeData
  const rdIn  = rangeData.map(s=>s.p);
  const rdOut = rangeData.map(s=>s.op>0?s.op/10:null).filter(v=>v!==null);
  const allVals = rdOut.length > 1 ? [...rdIn, ...rdOut] : rdIn;
  let mn=allVals[0], mx=allVals[0];
  for(const v of allVals){if(v<mn)mn=v;if(v>mx)mx=v;}
  const pad=(mx-mn)*0.15||0.5;
  mn-=pad; mx+=pad;

  const xOf = i => PL + (i/(samples.length-1||1))*cw;
  const yOf = v => PT + ch - ((v-mn)/(mx-mn||1))*ch;

  let yLabels = '';
  for(let i=0; i<=4; i++){
    const v = mn+(mx-mn)*(i/4);
    const y = PT+ch-(i/4)*ch;
    yLabels += `<text x="${PL-4}" y="${y+4}" fill="#7d8590" font-size="9" text-anchor="end">${v.toFixed(1)}</text>`;
    yLabels += `<line x1="${PL}" y1="${y}" x2="${PL+cw}" y2="${y}" stroke="#21262d" stroke-width="0.5"/>`;
  }

  let xLabels = '';
  if(samples.length > 1) {
    const fmtT = ts => { const d=new Date(ts*1000); return d.getHours()+':'+(d.getMinutes()+'').padStart(2,'0'); };
    [0, 0.25, 0.5, 0.75, 1].forEach(p => {
      const idx = Math.round(p*(samples.length-1));
      const x = PL + p*cw;
      const anchor = p===0 ? 'start' : p===1 ? 'end' : 'middle';
      xLabels += `<text x="${x.toFixed(1)}" y="${H-4}" fill="#7d8590" font-size="9" text-anchor="${anchor}">${fmtT(samples[idx].ts)}</text>`;
    });
  }

  const inPts = indoor.map((v,i) => xOf(i).toFixed(1)+','+yOf(v).toFixed(1));
  const inLine = `<polyline points="${inPts.join(' ')}" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linejoin="round"/>`;

  let outLine = '', cur = [];
  const flush = () => {
    if(cur.length > 1) outLine += `<polyline points="${cur.join(' ')}" fill="none" stroke="#bc8cff" stroke-width="1.5" stroke-linejoin="round"/>`;
    cur = [];
  };
  for(let i=0; i<samples.length; i++){
    if(outdoor[i]!==null) cur.push(xOf(i).toFixed(1)+','+yOf(outdoor[i]).toFixed(1));
    else flush();
  }
  flush();

  svg.innerHTML = yLabels + xLabels + inLine + outLine;
}

const CACHE_KEY = 'esp32_history';

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) { allData = JSON.parse(raw); renderAll(); return true; }
  } catch(e) {}
  return false;
}

function saveCache(data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e) {}
}

async function fetchHistory() {
  // If no data yet (first visit), fetch 2h first for a fast initial render
  if (!allData.length) {
    try {
      const r2 = await fetch('/api/history?hours=2');
      const quick = await r2.json();
      if (quick.length) { allData = quick; renderAll(); }
    } catch(e) {}
  }
  // Then fetch full 24h and update
  try {
    const r = await fetch('/api/history?hours=24');
    allData = await r.json();
    renderAll();
    saveCache(allData);
  } catch(e) {
    $('status').className = 'status stale';
    $('status').textContent = 'History fetch failed: ' + e;
  }
}

// Show cached data immediately; only show Loading… if nothing cached
if (!loadCache()) {
  $('chartIndoor').innerHTML = '<text x="430" y="50%" fill="#7d8590" text-anchor="middle" dominant-baseline="middle" font-size="12">Loading…</text>';
  $('chartPress').innerHTML  = '<text x="430" y="50%" fill="#7d8590" text-anchor="middle" dominant-baseline="middle" font-size="12">Loading…</text>';
}

fetchCurrent();
fetchHistory();
setInterval(fetchCurrent, 30000);
setInterval(fetchHistory, 300000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { fetchCurrent(); fetchHistory(); }
});
</script>
</body>
</html>
